services:
  ollama:
    build: ./ops/ollama
    container_name: argos-ollama
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    environment:
      - OLLAMA_VULKAN=1
      - OLLAMA_NUM_PARALLEL=2
    volumes:
      - ollama_data:/home/argos/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlzero:
    build: ./ops/mlzero
    container_name: argos-mlzero
    restart: unless-stopped
    volumes:
      - ./datasets:/home/argos/datasets
      - mlzero_models:/home/argos/models
    environment:
      - OPENAI_API_BASE=http://ollama:11434/v1
      - OPENAI_API_KEY=dummy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/mcp/"]
      interval: 10s
      timeout: 5s
      retries: 5

  hermes:
    build: ./ops/hermes
    container_name: argos-hermes
    depends_on:
      ollama:
        condition: service_healthy
      mlzero:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - LLM_API_BASE=http://ollama:11434/v1 
      - MCP_SERVER_MLZERO=http://mlzero:8000/mcp/
    volumes:
      - hermes_data:/home/argos/.hermes
    ports:
      - "8787:8787"
      - "8642:8642"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8642/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ollama_data:
  hermes_data:
  mlzero_models: